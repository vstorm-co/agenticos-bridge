name: checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    container: python:3.15-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.2
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src
  test:
    runs-on: ubuntu-latest
    container: python:3.15-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.2
      - run: uv sync --frozen
      - run: uv run pytest tests/test_oauth.py -q
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    container: python:3.15-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.2
      - run: uv export --frozen --no-dev --no-emit-project --output-file /tmp/bridge-requirements.txt
      - run: uvx pip-audit==2.10.1 -r /tmp/bridge-requirements.txt --require-hashes --disable-pip
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build from restrictive source permissions
        run: |
          chmod -R go-rwx src
          docker build -t agenticos-bridge:test .
      - name: Verify the unprivileged runtime can read the artifact
        run: docker run --rm --entrypoint /app/.venv/bin/python agenticos-bridge:test -c "import agenticos_bridge.main; from pathlib import Path; assert Path('/app/src/agenticos_bridge/public/index.html').read_text().startswith('<!doctype html>')"
