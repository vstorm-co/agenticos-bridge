[project]
name = "agenticos-bridge"
version = "0.1.0"
description = "Stateless OAuth broker for self-hosted AgenticOS"
requires-python = ">=3.15,<3.16"
dependencies = [
  "fastapi==0.162.6",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "cryptography==50.0.2",
]
[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "ty"]
[tool.ruff]
line-length = 100
target-version = "py315"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ty.environment]
root = ["./src"]
